<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#5a0d08" />
  <title>HOẠ ĐÈN ĐÓN TRĂNG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="sky-orb orb-1"></div>
  <div class="sky-orb orb-2"></div>
  <div id="cursor-star" class="cursor-star" aria-hidden="true">✦</div>
  <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">☾</span>
      <div>
        <div class="brand-name">HOẠ ĐÈN ĐÓN TRĂNG</div>
        <div class="brand-sub">Trung thu · một nét vẽ · một quẻ lành</div>
      </div>
    </div>
    <div id="progress" class="progress" aria-label="Tiến trình"></div>
  </header>

  <main id="screen" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
